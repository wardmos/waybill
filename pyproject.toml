[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-waybill"
version = "0.1.1"
description = "Portable handoff bundles for coding agents."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Waybill Project" }
]
keywords = [
  "agents",
  "coding-agents",
  "handoff",
  "waybill"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wardmos/waybill"
Repository = "https://github.com/wardmos/waybill"
Issues = "https://github.com/wardmos/waybill/issues"

[project.scripts]
waybill = "waybill_core.cli:main"

[tool.setuptools]
packages = [
  "waybill_core",
  "waybill_core._adapter_wrappers",
  "waybill_core._handoff_skill",
]
include-package-data = true

[tool.setuptools.package-dir]
"waybill_core._adapter_wrappers" = "adapters"
"waybill_core._handoff_skill" = "skills/handoff"

[tool.setuptools.package-data]
"waybill_core._adapter_wrappers" = [
  "claude-code/skills/*/SKILL.md",
  "cursor/rules/*.mdc",
  "gemini-cli/skills/*/SKILL.md",
  "opencode/commands/*.md",
  "opencode/skills/*/SKILL.md",
]
"waybill_core._handoff_skill" = [
  "SKILL.md",
  "references/*.md",
  "assets/bundle-template/*",
  "scripts/*.py",
]
