name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run repository validation
        run: python3 scripts/validate-waybill.py

      - name: Compile Python files
        run: python3 -m py_compile cli/waybill waybill_core/*.py scripts/validate-waybill.py

      - name: Dry-run agent smoke commands
        run: scripts/smoke-agents.sh --dry-run
